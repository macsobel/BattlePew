name: Build BattlePew (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r macos-app/requirements-app.txt pywebview pyinstaller

      - name: Smoke-test imports
        run: |
          python -c "import battletag.app, battletag.modes, desktop_launcher, webview, hid; print('OK', len(battletag.modes.MODE_CATALOG), 'modes')"

      - name: Generate Windows icon
        run: |
          python -c "from PIL import Image; import os; os.makedirs('build', exist_ok=True); img = Image.open('macos-app/Resources/AppIcon-1024.png').convert('RGBA'); img.save('build/BattlePew.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Windows single-file .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BattlePew `
            --icon "build/BattlePew.ico" `
            --add-data "battletag;battletag" `
            --add-data "run_battletag.py;." `
            --collect-submodules battletag `
            --collect-all webview `
            --collect-all clr_loader `
            --collect-all pythonnet `
            --hidden-import hid `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            desktop_launcher.py

      - name: Smoke-test built Windows .exe
        shell: pwsh
        run: |
          $logPath = "build/smoke-test-windows.log"
          $proc = Start-Process -FilePath "dist/BattlePew.exe" -ArgumentList "--smoke-test", "--smoke-test-log", $logPath -PassThru -Wait
          if (Test-Path $logPath) { Get-Content $logPath }
          if ($proc.ExitCode -ne 0) {
            Write-Error "Windows .exe smoke test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Package Windows release executable
        shell: pwsh
        run: |
          $version = python -c "import battletag; print(battletag.__version__)"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exePath = "release/BattlePew-Windows-$version-$shortSha.exe"
          Copy-Item "dist/BattlePew.exe" $exePath -Force
          Get-ChildItem release

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: battlepew-windows-${{ github.sha }}
          path: release/BattlePew-Windows-*.exe
          retention-days: 5

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libhidapi-hidraw0 \
            libhidapi-libusb0 \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            desktop-file-utils \
            file

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r macos-app/requirements-app.txt "pywebview[gtk]" pyinstaller

      - name: Smoke-test imports
        run: |
          python -c "import battletag.app, battletag.modes, desktop_launcher, webview, gi, hid; print('OK', len(battletag.modes.MODE_CATALOG), 'modes')"

      - name: Build Linux app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name BattlePew \
            --add-data "battletag:battletag" \
            --add-data "run_battletag.py:." \
            --collect-submodules battletag \
            --collect-all webview \
            --hidden-import hid \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            desktop_launcher.py

      - name: Package Linux AppImage
        run: |
          VERSION=$(python -c "import battletag; print(battletag.__version__)")
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p release AppDir/usr/lib/battlepew AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a dist/BattlePew/. AppDir/usr/lib/battlepew/
          ln -s ../lib/battlepew/BattlePew AppDir/usr/bin/BattlePew
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/battlepew/BattlePew" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/battlepew.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=BattlePew
          Comment=Arena Master Control Center for Battle Tag
          Exec=BattlePew
          Icon=battlepew
          Categories=Game;
          Terminal=false
          EOF
          desktop-file-validate AppDir/battlepew.desktop
          python -c "from PIL import Image; img = Image.open('macos-app/Resources/AppIcon-1024.png').convert('RGBA').resize((256, 256), Image.LANCZOS); img.save('AppDir/battlepew.png'); img.save('AppDir/.DirIcon'); img.save('AppDir/usr/share/icons/hicolor/256x256/apps/battlepew.png')"
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          APPIMAGE_OUT="release/BattlePew-Linux-${VERSION}-${SHORT_SHA}-x86_64.AppImage"
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "$APPIMAGE_OUT"
          chmod +x "$APPIMAGE_OUT"
          ls -lh release

      - name: Smoke-test built Linux AppImage
        run: |
          APPIMAGE_OUT=$(ls release/BattlePew-Linux-*.AppImage | head -n 1)
          "$APPIMAGE_OUT" --appimage-extract-and-run --smoke-test --smoke-test-log build/smoke-test-linux.log
          cat build/smoke-test-linux.log

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: battlepew-linux-${{ github.sha }}
          path: release/BattlePew-Linux-*.AppImage
          retention-days: 5

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: battlepew-windows-${{ github.sha }}
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: battlepew-linux-${{ github.sha }}
          path: release

      - name: Attach archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
