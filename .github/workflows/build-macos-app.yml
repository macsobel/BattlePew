name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build BattlePew.app (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log toolchain versions
        run: |
          sw_vers
          uname -m
          swiftc --version

      - name: Cache embedded Python & pip downloads
        uses: actions/cache@v4
        with:
          path: |
            macos-app/.cache
            ~/Library/Caches/pip
          key: macos-app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos-app/build_macos_app.sh', 'macos-app/requirements-app.txt') }}
          restore-keys: |
            macos-app-${{ runner.os }}-${{ runner.arch }}-

      - name: Build, smoke-test, and package BattlePew.app
        run: bash macos-app/build_macos_app.sh --package --smoke-test

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: battlepew-macos-${{ github.sha }}
          path: |
            macos-app/build/BattlePew-macOS-*.zip
            macos-app/build/BUILD_MANIFEST.txt
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: battlepew-macos-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BattlePew-macOS-*.zip
          generate_release_notes: true
